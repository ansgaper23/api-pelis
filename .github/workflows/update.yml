- name: Guardar los JSON generados en el repositorio
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        
        # Añade solo los archivos JSON que te interesan
        git add *.json
        
        # Hace el commit solo si detecta que hubo modificaciones
        git commit -m "Actualizar catálogo" || echo "No hay cambios para hacer commit"
        
        # 🔑 LA SOLUCIÓN: Descargar los cambios remotos antes de subir
        git pull --rebase origin main
        
        # Subir los cambios finales
        git push
