name: Actualizar Cartelera Perucho TV

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar el Scraper
        run: node scraper.js

      - name: Guardar los JSON generados en el repositorio
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Restaurar package-lock.json a su estado original para que no estorbe
          git checkout -- package-lock.json || true
          
          # Agregar SOLO los dos archivos JSON que nos importan
          git add peliculas.json series.json
          
          # Hacer commit. Si no hay cambios, no fallará gracias al '|| true'
          git commit -m "Actualización masiva de catálogo" || true
          
          # Bajar la última versión del repo forzando la integración
          git pull --rebase origin main || true
          
          # Subir los archivos forzando si es necesario
          git push origin main
