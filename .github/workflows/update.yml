name: Actualizar Cartelera Perucho TV

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 🔑 Descarga el historial completo para evitar errores de sincronización

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar el Scraper
        run: node scraper.js

      - name: Guardar los JSON generados en el repositorio
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Agregamos solo los archivos JSON
          git add *.json
          
          # 🔑 Validamos si hay cambios reales en los JSON antes de intentar subir algo
          if git diff --staged --quiet; then
            echo "✅ No hay películas ni series nuevas. Se omite la subida."
          else
            echo "🚀 Cambios detectados. Preparando subida..."
            git commit -m "Actualización automática de JSON"
            
            # Restauramos package-lock.json para evitar conflictos en el pull
            git checkout -- package-lock.json
            
            # Sincronizamos con el repositorio remoto de forma segura
            git pull --rebase origin main
            
            # Subimos los archivos
            git push
          fi
